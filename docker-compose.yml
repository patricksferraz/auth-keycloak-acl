version: '3.4'

services:
  auth-keycloak-acl:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    environment:
      ENV: dev
      ELASTIC_APM_SERVICE_NAME: auth-service
    ports:
      - $AUTH_GRPC_PORT:50051
      - $AUTH_REST_PORT:8080
    volumes:
      - .:/go/src/
    networks:
      - auth
    extra_hosts:
      - 'host.docker.internal:172.17.0.1'

networks:
  auth:
    driver: bridge
