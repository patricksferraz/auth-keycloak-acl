apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: coding4u.azurecr.io/auth-service
        ports:
        - name: grpc
          containerPort: 50051
        - name: rest
          containerPort: 8080
        envFrom:
          - secretRef:
              name: auth-secret
          - configMapRef:
              name: auth-conf
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"

      imagePullSecrets:
        - name: regcred
