name: Auth - Continuous Integration (CI)

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:

  go:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Prepare
      id: prep
      run: |
        GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")
        DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/auth-service
        TAGS="${DOCKER_IMAGE}:${GIT_HASH},${DOCKER_IMAGE}:latest"
        echo ::set-output name=tags::${TAGS}
        echo ::set-output name=git_hash::${GIT_HASH}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v1

    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ steps.prep.outputs.git_hash }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Login to ghcr
      uses: docker/login-action@v1
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Test
      uses: docker/build-push-action@v2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        file: .docker/Dockerfile.test

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v2
      if: github.event_name != 'pull_request'
      with:
        builder: ${{ steps.buildx.outputs.name }}
        file: .docker/Dockerfile.prod
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.prep.outputs.tags }}
        target: runtime
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache

    - name: Image digest
      if: github.event_name != 'pull_request'
      run: echo ${{ steps.docker_build.outputs.digest }}
